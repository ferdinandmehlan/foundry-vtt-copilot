[project]
name = "foundry-vtt-copilot"
version = "0.1.0"
description = "AI powered Assistant for Foundry VTT"
authors = [
    {name = "Ferdinand Mehlan", email = "ferdinand.mehlan@gmail.com"},
]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "ag-ui-protocol>=0.1.20",
    "agno[os]>=2.9.0",
    "openai>=3.1.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "arize-phoenix>=20.2.1",
    "openinference-instrumentation-agno>=1.0.3",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
